# DFIOS reverse proxy (demo.md §3 container nginx): one entry point for the web UI and the API, plain HTTP.
# Routes: locations.inc. HTTPS: docker-compose.https.yml swaps this file for https.conf (research_v2 H6).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dfios_api { server backend:8000; }
upstream dfios_web { server frontend:5173; }

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;          # CSV imports

    include /etc/nginx/dfios/locations.inc;
}
