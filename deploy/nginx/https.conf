# DFIOS reverse proxy over HTTPS (research_v2 H6 / NFR5), used by docker-compose.https.yml.
# Certificate: deploy/certs/fullchain.pem + privkey.pem (never committed). For a local test, generate a self-signed
# pair with deploy/make_dev_cert.sh; in production mount the real certificate (e.g. Let's Encrypt) at the same paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dfios_api { server backend:8000; }
upstream dfios_web { server frontend:5173; }

# plain HTTP only redirects (the JWT never travels in clear text)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 50m;          # CSV imports

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:dfios_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/dfios/locations.inc;
}
